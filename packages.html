<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EverAfter | Wedding Packages</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/packages.css">

</head>

<body>

  <header id="main-header">
    <button id="btnNav">
      <img src="resources/images/menu.png" alt="Menu">
    </button>
    <h1 class="titulo logo"> EverAfter </h1>
    <nav id="navMenu">

        <li><a href="menu.html">Home</a></li>

  <section class="search-wrap">

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Example: Luxury">
      <button onclick="clearSearch()">✕</button>

      <select id="filterCategory">
        <option value="all">All Categories</option>
        <option value="Classic">Classic</option>
        <option value="Premium">Premium</option>
        <option value="Outdoor">Outdoor</option>
        <option value="Beach">Beach</option>

      </select>
    </div>

  <main>
    <section id="packages">
      <section id="packages-container"></section>

      <section id="package-details">

        <h2>Select a package</h2>

        <p>Package details will appear here.</p>

      </section>

  <footer id="main-footer">
